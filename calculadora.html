<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora — API</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 560px;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #555;
      margin-bottom: 1.75rem;
    }

    .api-url {
      font-family: monospace;
      font-size: 0.75rem;
      color: #444;
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.online  { background: #22c55e; }
    .dot.offline { background: #ef4444; }

    .inputs {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .input-group {
      flex: 1;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 0.35rem;
    }

    input[type="number"] {
      width: 100%;
      background: #111;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #e8e8e8;
      font-size: 1.1rem;
      padding: 0.6rem 0.75rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: #4f8ef7;
    }

    .ops {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    button {
      background: #1f1f1f;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #ccc;
      font-size: 0.95rem;
      padding: 0.65rem 0;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    button:hover  { background: #2a2a2a; border-color: #4f8ef7; color: #fff; }
    button:active { background: #222; }

    button[data-op="sumar"]      { --accent: #22c55e; }
    button[data-op="restar"]     { --accent: #ef4444; }
    button[data-op="multiplicar"]{ --accent: #f59e0b; }
    button[data-op="dividir"]    { --accent: #3b82f6; }

    button:hover { border-color: var(--accent, #4f8ef7); }

    .block-label {
      font-size: 0.7rem;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }

    pre {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 1rem;
      font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
      font-size: 0.8rem;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre;
      color: #aaa;
      min-height: 4rem;
    }

    pre .key     { color: #9ecbff; }
    pre .str     { color: #9ecbff; }
    pre .num     { color: #79c0ff; }
    pre .comment { color: #444; font-style: italic; }
    pre .error   { color: #ef4444; }
    pre .url     { color: #58a6ff; }

    .spacer { height: 0.75rem; }

    .result-value {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
      margin: 1rem 0 0.5rem;
      letter-spacing: -0.02em;
    }
    .result-value.hidden { display: none; }
  </style>
</head>
<body>
<div class="card">
  <h1>Calculadora API</h1>
  <p class="subtitle">Llama a la API REST y muestra request / response en tiempo real</p>

  <div class="api-url">
    <span class="dot" id="dot"></span>
    <span id="api-base">http://localhost:5277/api/calculadora</span>
  </div>

  <div class="inputs">
    <div class="input-group">
      <label for="a">Valor A</label>
      <input id="a" type="number" value="28" step="any" />
    </div>
    <div class="input-group">
      <label for="b">Valor B</label>
      <input id="b" type="number" value="32" step="any" />
    </div>
  </div>

  <div class="ops">
    <button data-op="sumar">+ Sumar</button>
    <button data-op="restar">− Restar</button>
    <button data-op="multiplicar">× Multiplicar</button>
    <button data-op="dividir">÷ Dividir</button>
  </div>

  <div class="block-label">Request</div>
  <pre id="req"><span class="comment">// presiona una operación para ver el request</span></pre>

  <div class="spacer"></div>

  <div class="block-label">Response</div>
  <pre id="res"><span class="comment">// aquí aparecerá la respuesta de la API</span></pre>

  <div class="result-value hidden" id="result-display"></div>
</div>

<script>
  const BASE = "http://localhost:5277/api/calculadora";
  const dot  = document.getElementById("dot");
  const reqEl = document.getElementById("req");
  const resEl = document.getElementById("res");
  const resultDisplay = document.getElementById("result-display");

  function syntaxHighlight(json) {
    return json
      .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, match => {
        if (/^"/.test(match)) {
          if (/:$/.test(match)) return `<span class="key">${match}</span>`;
          return `<span class="str">${match}</span>`;
        }
        return `<span class="num">${match}</span>`;
      });
  }

  async function call(op) {
    const a = document.getElementById("a").value;
    const b = document.getElementById("b").value;
    const url = `${BASE}/${op}?a=${a}&b=${b}`;

    reqEl.innerHTML =
      `<span class="comment">// GET</span>\n` +
      `<span class="url">${url}</span>`;

    resEl.innerHTML = `<span class="comment">// esperando respuesta...</span>`;
    resultDisplay.classList.add("hidden");

    try {
      const res = await fetch(url);
      const data = await res.json();
      const pretty = JSON.stringify(data, null, 2);
      resEl.innerHTML = syntaxHighlight(pretty);

      if (data.resultado !== undefined) {
        resultDisplay.textContent = data.resultado;
        resultDisplay.classList.remove("hidden");
      }

      dot.className = "dot online";
    } catch (err) {
      resEl.innerHTML =
        `<span class="error">// Error: no se pudo conectar con la API</span>\n` +
        `<span class="comment">// Verifica que el proyecto Api esté corriendo en Rider</span>\n` +
        `<span class="error">${err.message}</span>`;
      dot.className = "dot offline";
      resultDisplay.classList.add("hidden");
    }
  }

  document.querySelectorAll("button[data-op]").forEach(btn => {
    btn.addEventListener("click", () => call(btn.dataset.op));
  });

  // ping de estado al cargar
  fetch(`${BASE}/sumar?a=1&b=0`)
    .then(() => dot.className = "dot online")
    .catch(() => dot.className = "dot offline");
</script>
</body>
</html>
